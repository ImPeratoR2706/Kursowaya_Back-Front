services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hair_salon_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./Backend
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      POSTGRES_DB: ${POSTGRES_DB:-hair_salon_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Browser origin for CORS (if you access backend directly)
      CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             if [ ! -f apps/salon/ai_module/no_show_model.cbm ]; then
               python manage.py train_no_show_model --n 8000 --min-accuracy 0.75;
             fi &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_BASE: /
    depends_on:
      - backend
    ports:
      - "8080:8080"

volumes:
  pgdata:

